name: Daily News Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch and curate news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit updated news.json
        run: |
          git config --global user.name "sirjonyive-bot"
          git config --global user.email "bot@sirjonyive.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: daily news refresh [skip ci]"
          git push

      - name: Trigger Netlify deploy
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

      - name: Post to Voxxee
        run: |
          curl -s -X POST https://xenchee.netlify.app/.netlify/functions/pipeline-post \
            -H "Content-Type: application/json" \
            -H "x-pipeline-secret: ${{ secrets.PIPELINE_SECRET }}" \
            -d '{
              "slug": "sir-jony-ive",
              "title": "🍎 Sir Jony Ive — Latest News & Design Updates",
              "summary": "The latest news and updates on Sir Jony Ive, Apple design legend and creative visionary.",
              "url": "https://sirjonyive.com"
            }'
